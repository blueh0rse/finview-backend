services:
  db:
    image: postgres:18-alpine
    container_name: finview-db
    shm_size: 128mb
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: finview-adminer
    restart: always
    ports:
      - "9090:8080"
    depends_on:
      - db

  api:
    build: .
    container_name: finview-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app 
    command: >
      sh -c "
        sleep 1 && 
        uv run alembic upgrade head &&
        uv run fastapi dev api/main.py --host 0.0.0.0
      "

volumes:
  postgres_data:
